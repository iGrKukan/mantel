name: Mantel
options:
  bundleIdPrefix: by.maru
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: U5BAN54DL2
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Mantel:
    type: application
    platform: macOS
    sources:
      # Info-MAS.plist — чужой Info.plist (см. цель Mantel-MAS): исключаем из ресурсов,
      # иначе он просто ляжет в бандл лишним файлом.
      - path: Sources
        excludes:
          - Info-MAS.plist
      # Адаптер системного «сейчас играет» (MediaRemote): бандлится как ресурс,
      # но НЕ линкуется — фреймворк грузит /usr/bin/perl, не наше приложение.
      - path: Vendor/mediaremote-adapter
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Mantel
        CFBundleDisplayName: Mantel
        CFBundleIdentifier: by.maru.Mantel
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MARU Systems"
        NSDesktopFolderUsageDescription: "Mantel убирает свежие скриншоты и записи экрана с Рабочего стола в свою полку."
        NSDocumentsFolderUsageDescription: "Mantel показывает добавленные файлы в полке."
        NSDownloadsFolderUsageDescription: "Mantel показывает добавленные файлы в полке."
        NSAppleEventsUsageDescription: "Открытие файлов из полки."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.maru.Mantel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        COMBINE_HIDPI_IMAGES: YES

  # Вторая цель — для Mac App Store: песочница + hardened runtime, без адаптера
  # MediaRemote (приватный API — Vendor/mediaremote-adapter сюда не включаем).
  # Тот же бандл-идентификатор, что у обычной цели — каналы распространения разные,
  # это нормально. #if APPSTORE в исходниках переключает системный плеер на AppleScript.
  Mantel-MAS:
    type: application
    platform: macOS
    sources:
      # Sources/Info.plist — Info.plist обычной цели, у MAS свой (Info-MAS.plist,
      # см. info.path ниже) — исключаем, иначе оба лягут в бандл, а xcodegen ещё и
      # перезаписывает физический файл при генерации: держать общий Info.plist
      # на две цели с разными properties нельзя.
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info-MAS.plist
      properties:
        CFBundleName: Mantel
        CFBundleDisplayName: Mantel
        CFBundleIdentifier: by.maru.Mantel
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MARU Systems"
        NSDesktopFolderUsageDescription: "Mantel убирает свежие скриншоты и записи экрана с Рабочего стола в свою полку."
        NSDocumentsFolderUsageDescription: "Mantel показывает добавленные файлы в полке."
        NSDownloadsFolderUsageDescription: "Mantel показывает добавленные файлы в полке."
        NSAppleEventsUsageDescription: "Чтобы показать «сейчас играет», Mantel через Автоматизацию обращается к приложениям «Музыка» и Spotify."
    settings:
      base:
        PRODUCT_NAME: Mantel
        PRODUCT_BUNDLE_IDENTIFIER: by.maru.Mantel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/Mantel-MAS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U5BAN54DL2
schemes:
  Mantel:
    build:
      targets:
        Mantel: all
    run:
      config: Release
  Mantel-MAS:
    build:
      targets:
        Mantel-MAS: all
    run:
      config: Release
